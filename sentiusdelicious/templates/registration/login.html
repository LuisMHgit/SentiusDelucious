{% extends "base.html" %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card shadow-lg border-0" style="width: 400px; border-radius: 15px;">

        <div class="card-body p-4">

            <div class="text-center mb-4">
                <h3>🍽️ SentiusDelicious</h3>
                <p class="text-muted">Inicia sesión para continuar</p>
            </div>

            <form method="post">
                {% csrf_token %}

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuario o contraseña incorrectos
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario">
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Ingresa tu contraseña">
                </div>

                <button type="submit" class="btn btn-dark w-100">
                    Entrar
                </button>
            </form>

        </div>

    </div>

</div>

{% endblock %}
